[project]
name = "envyzer"
version = "0.1.0"
description = "Compare .env files across environments, find missing and mismatched variables"
authors = [{ name = "shyh26", email = "shyh26@users.noreply.github.com" }]
requires-python = ">=3.10"
keywords = ["dotenv", "environment", "config", "devops", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=14.2.0",
    "typer>=0.21.0",
]

[project.scripts]
envyzer = "envcheck.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/envcheck"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Homepage = "https://shyh26.github.io/envcheck"
Repository = "https://github.com/shyh26/envcheck"
